name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: omnichat
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: omnichat_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U omnichat -d omnichat_test' --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://omnichat:ci-test-only@127.0.0.1:5432/omnichat_test
      TEST_DATABASE_URL: postgresql://omnichat:ci-test-only@127.0.0.1:5432/omnichat_test
      LIVE_OMNIROUTE_TESTS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.30.3}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate && pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @omnichat/mobile test
      - run: pnpm --filter @omnichat/desktop test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
